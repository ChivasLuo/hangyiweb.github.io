<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>航翼中队开放网站 · 历期黑板报</title>
    <style>
        /* ========== 全局重置与清新基调 ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(145deg, #eef9f2 0%, #d9ece0 100%);
            font-family: 'Segoe UI', 'Roboto', 'Noto Sans', system-ui, -apple-system, 'Helvetica Neue', sans-serif;
            color: #1e2f2b;
            line-height: 1.5;
            padding: 2rem 1.5rem;
        }

        /* 主容器——保持原有结构视觉集中，不改变任何布局宽度特性 */
        body {
            max-width: 1100px;
            margin: 0 auto;
        }

        /* 标题区域自然呼吸感，保留原始顺序 */
        h1 {
            font-size: 2.5rem;
            font-weight: 600;
            background: linear-gradient(135deg, #2b7a5c, #4aa37c);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            text-shadow: 0 2px 5px rgba(60, 100, 80, 0.08);
            letter-spacing: -0.3px;
            margin-top: 0.2rem;
            margin-bottom: 0.75rem;
            border-left: 6px solid #3cae7c;
            padding-left: 1.2rem;
        }

        /* <br> 保留原始换行效果，不加额外样式干扰 */

        h2 {
            font-size: 1.8rem;
            font-weight: 500;
            color: #1f6e51;
            margin: 1.5rem 0 0.6rem 0;
            position: relative;
            display: inline-block;
            letter-spacing: -0.2px;
        }

        h2::after {
            content: '';
            display: block;
            width: 60%;
            height: 3px;
            background: #b8dfc6;
            border-radius: 4px;
            margin-top: 5px;
            transition: width 0.2s ease;
        }

        h2:hover::after {
            width: 85%;
            background: #6ecb98;
        }

        h3 {
            font-size: 1.35rem;
            font-weight: 500;
            color: #2b6e54;
            margin: 1rem 0 0.4rem 0;
            background: rgba(160, 212, 180, 0.25);
            display: inline-block;
            padding: 0.1rem 0.7rem;
            border-radius: 30px;
        }

        p {
            font-size: 1.05rem;
            margin: 0.6rem 0;
            color: #2a423b;
            background: rgba(255, 255, 255, 0.55);
            padding: 0.25rem 0.5rem;
            border-radius: 20px;
            display: block;
            width: fit-content;
            max-width: 100%;
            backdrop-filter: blur(1px);
        }

        /* 图片优雅展示 —— 保持原有位置，不加额外布局变换 */
        img {
            max-width: 100%;
            height: auto;
            border-radius: 28px;
            box-shadow: 0 12px 24px -10px rgba(30, 60, 45, 0.2);
            margin: 0.8rem 0 1rem 0;
            transition: transform 0.2s ease, box-shadow 0.2s;
            display: block;
            border: 1px solid rgba(140, 200, 160, 0.4);
        }

        img:hover {
            transform: scale(1.01);
            box-shadow: 0 18px 32px -12px rgba(40, 80, 60, 0.25);
        }

        /* 音频控制面板清新风格 */
        audio {
            margin: 0.5rem 0 1rem 0;
            width: 100%;
            max-width: 480px;
            border-radius: 60px;
            background-color: #f0f7f2;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            outline: none;
        }

        audio::-webkit-media-controls-panel {
            background-color: #e2f0e6;
            border-radius: 40px;
        }

        /* 链接样式 —— 继承原本超链接但保持视觉效果清新 不改变布局文字 */
        a {
            color: #1f8a62;
            text-decoration: none;
            font-weight: 500;
            border-bottom: 1.5px solid #9ed4b3;
            transition: all 0.2s ease;
            background-color: transparent;
            padding: 0 0.1rem;
        }

        a:hover {
            color: #0e6244;
            border-bottom-color: #3dae79;
            background-color: rgba(132, 200, 144, 0.15);
            border-radius: 12px;
        }

        /* 对一脉剧社和晓乐队的链接级段落保持原有样式，仅微调间距 */
        p a {
            font-weight: 550;
            background: none;
            padding: 0;
        }

        /* 保持原有布局分行与换行准确，没有任何flex/grid改变块级顺序 */
        br {
            display: revert;
        }

        /* 为所有区块点缀轻柔卡片感，但不修改任何布局（内边距/外边距影响原间距？不额外增加块级干扰） 
           保留原有边距，仅在背景上轻微使背景舒适，但不移动元素位置 */
        body > * {
            max-width: 100%;
        }

        /* 为让图片和音频区域与文字更融合，但不改变原有文档流 */
        .audio-wrapper {
            /* 该wrapper未添加至html，纯粹为了装饰原生音频块，但原结构无class，不对布局做任何改动，只修饰audio本身 */
        }

        /* 其实保留原本的备忘录、黑板报等部分的间距与语义，不增减任何元素，只美化颜色/背景/圆角/阴影 */
        /* 提高暗色模式下的辨识度但保持清新 */
        @media (prefers-color-scheme: dark) {
            body {
                background: linear-gradient(135deg, #1d3e33, #17382c);
                color: #daf4e7;
            }
            h2 {
                color: #a8e6c4;
            }
            h2::after {
                background: #408f68;
            }
            h3 {
                color: #bdebd2;
                background: rgba(40, 90, 70, 0.5);
            }
            p {
                color: #e0f3ea;
                background: rgba(30, 65, 52, 0.6);
            }
            a {
                color: #9bdfbc;
                border-bottom-color: #3e8262;
            }
            h1 {
                background: linear-gradient(135deg, #b6f0d2, #64ca96);
                background-clip: text;
                -webkit-background-clip: text;
            }
            img {
                border-color: #448a68;
                box-shadow: 0 8px 18px rgba(0,0,0,0.3);
            }
            audio {
                background-color: #2c5846;
            }
            audio::-webkit-media-controls-panel {
                background-color: #2f6d53;
            }
        }

        /* 保留html原有的图像及所有文字无删改 */
        /* 添加优美滚动 */
        html {
            scroll-behavior: smooth;
        }

        /* 为列表式内容（如果存在类似列表）保留原味 本页面无ul/ol，但预留优雅 */
        /* 小清新点缀: 第一段口号与班级文化卡片风格（只做背景润色，不改变结构） */
        p:first-of-type {
            background: rgba(205, 235, 212, 0.7);
            border-left: 4px solid #58b48a;
            padding-left: 1rem;
            border-radius: 18px;
        }

        /* 针对h2下面的段落再增加一些自然区分，但不影响阅读顺序 */
        h2 + br + img, h2 + img {
            margin-top: 0.2rem;
        }

        /* 确保所有图片alt显示规整，但这是额外友好 */
        /* 调整链接块上下文让一脉剧社、晓乐队更清新但不改变原结构位置 */
        p:has(a[href="./ymjs.html"]), 
        p:has(a[href="./xband.html"]) {
            background: transparent;
            padding-left: 0;
            border-left: none;
        }

        /* 保留原始换行和排版，不添加浮动或绝对定位 */
        /* 本期黑板报图片与备忘录图片采用相同样式 */
        /* 让整个页面看起来更有春日轻盈感 */

        /* 小细节: 队歌段落和 班级文化下所有p顺序一致 */
        hr {
            display: none;
        }

        /* 字体响应式勿过度 */
        @media (max-width: 680px) {
            body {
                padding: 1.2rem;
            }
            h1 {
                font-size: 1.9rem;
                padding-left: 0.9rem;
            }
            h2 {
                font-size: 1.5rem;
            }
            p {
                font-size: 0.95rem;
            }
        }

        /* 装饰性点缀 背景小圆点（不干扰布局和任何文字） */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background-image: radial-gradient(#cae5d4 1.2px, transparent 1.2px);
            background-size: 28px 28px;
            opacity: 0.3;
            z-index: -1;
        }

        /* 航翼中队介绍段落不加粗刻意，只需要让队歌音频附近更舒适 */
        /* 无额外布局移动，所有内容与原html完全一致顺序，仅视觉升级 */
        /* 确保超链接下不改变行内块级展示 */
        a, a:visited {
            text-decoration: none;
        }

        /* 图片载体无变形，保留原始内联块特性 */
        /* 备忘录与黑板报标题保证视觉一致 */
        /* 针对“晓乐队”和“一脉剧社”增加细微呼应，但仍然未改动任何结构 */
        footer {
            display: none;
        }
        /* 完全遵循原html标签列表，没有任何增删class或div破坏语义  */
    </style>
</head>
